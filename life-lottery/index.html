<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Lottery</title>
<meta name="description" content="Draw a random American life and roll from age 5 to 55. Your family's income sets your odds. Built on real US mobility data. An Equitable Earth Solutions tool.">
<meta property="og:title" content="Life Lottery">
<meta property="og:description" content="Draw a random American life. Roll the dice. Your family's income sets your odds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow game column, like a handheld: income ticker, HUD, scene, dialog box with a die and a WHY? data card, choices. Single dark theme on purpose. */
:root{
  --night:#1b1830; --panel:#26213f; --edge:#4a3f73; --paper:#f1e7d0; --dim:#b3a8c9;
  --amber:#f2a541; --good:#5cc8a6; --bad:#ec6a5e;
  --pixel:"Press Start 2P", ui-monospace, monospace; --type:"VT323", ui-monospace, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--type);font-size:21px;line-height:1.15;-webkit-font-smoothing:none}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:12px 32px;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
header h1{font-family:var(--pixel);font-size:14px;letter-spacing:1px;margin:0;color:var(--amber)}
header a{font-family:var(--pixel);font-size:8px;color:var(--dim);text-decoration:none;letter-spacing:.5px}
header a:hover,header a:focus-visible{color:var(--paper)}
.hud{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-family:var(--pixel);font-size:9px;letter-spacing:.5px;color:var(--dim)}
.hud b{color:var(--paper);font-weight:400}
.wincount{color:var(--amber)} .wincount b{color:var(--amber)}
.wins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.wins li{display:flex;gap:10px;color:var(--good)}
.wins li span{font-family:var(--pixel);font-size:8px;color:var(--dim);min-width:22px;padding-top:5px}
.hearts{display:flex;gap:3px}
.heart{width:12px;height:11px;background:var(--bad);clip-path:polygon(0 18%,18% 0,40% 0,50% 18%,60% 0,82% 0,100% 18%,100% 45%,50% 100%,0 45%)}
.heart.off{background:var(--edge)}
.screen{position:relative;border:4px solid var(--edge);background:#000;box-shadow:0 0 0 4px var(--night),0 0 0 8px var(--panel)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;aspect-ratio:160/96;max-width:100%}
.agetag{position:absolute;top:6px;left:6px;font-family:var(--pixel);font-size:8px;background:rgba(0,0,0,.55);padding:4px 5px;color:var(--paper)}
.dialog{background:var(--panel);border:4px solid var(--paper);box-shadow:inset 0 0 0 3px var(--night);padding:12px 14px;min-height:130px;display:flex;flex-direction:column;gap:8px}
.dialog p{margin:0}
.dialog p.good{color:var(--good)} .dialog p.bad{color:var(--bad)}
.dialog .q{color:var(--amber)}
.choices{display:flex;flex-direction:column;gap:8px}
.btn{font-family:var(--pixel);font-size:11px;letter-spacing:.5px;text-align:left;background:var(--night);color:var(--paper);border:3px solid var(--paper);padding:13px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;min-height:48px;width:100%}
.btn .cur{visibility:hidden;color:var(--amber)}
.btn:hover .cur,.btn:focus-visible .cur{visibility:visible;animation:blink .8s steps(1) infinite}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn small{display:block;font-family:var(--type);font-size:18px;letter-spacing:0;color:var(--dim);margin-top:4px}
.btn.primary{background:var(--amber);color:var(--night);border-color:var(--amber)}
.btn.primary .cur{color:var(--night)}
.btn.primary small{color:var(--night);opacity:.8}
@keyframes blink{50%{visibility:hidden}}
.ticker{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;background:var(--panel);border:3px solid var(--amber);padding:8px 10px;font-family:var(--pixel);font-size:8px;letter-spacing:.5px;line-height:1.6;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.tk-idx{color:var(--dim)} .tk-goal{color:var(--paper);flex:1 1 100%;font-size:9px}
.tk-pts{color:var(--dim)} .tk-pts b{color:var(--amber);font-size:14px;font-weight:400}
.tk-pts em{font-style:normal;margin-left:4px} .tk-pts em.up{color:var(--good)} .tk-pts em.down{color:var(--bad)}
.tk-base{color:var(--dim);margin-left:auto}
.tk-flash{flex:1 1 100%;padding:4px 6px;color:var(--night)} .tk-flash.hit{background:var(--good)} .tk-flash.miss{background:var(--bad)}
.why{align-self:flex-start;font-family:var(--pixel);font-size:9px;letter-spacing:.5px;background:none;color:var(--amber);border:2px solid var(--amber);padding:8px 10px;cursor:pointer;min-height:36px}
.why:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{border-left:4px solid var(--amber);background:var(--night);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.card h3{font-family:var(--pixel);font-size:7px;letter-spacing:.5px;color:var(--amber);margin:0}
.card p{margin:0;font-size:19px} .card .src{font-size:17px;color:var(--dim)} .card a,.sources a{color:var(--paper)}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-family:var(--pixel);font-size:8px;letter-spacing:.5px}
.res li{display:flex;gap:8px;align-items:center} .res li.hit{color:var(--good)} .res li.miss{color:var(--bad)}
.res i{font-style:normal;width:14px;height:14px;border:2px solid currentColor;display:inline-grid;place-items:center;font-size:8px}
.res li.hit i{background:var(--good);color:var(--night)}
.spark{width:100%;height:auto;max-width:100%}
.spark .line{fill:none;stroke:var(--amber);stroke-width:2}
.spark .grid{stroke:var(--edge);stroke-dasharray:3 3}
.spark .lbl{fill:var(--dim);font-family:var(--type);font-size:12px}
.spark .dot{fill:var(--amber)}
.bar10{display:flex;gap:2px;flex:1 1 140px;min-width:0;align-self:center}
.bar10 .seg{flex:1;height:14px;background:var(--edge)}
.bar10 .seg.on{background:var(--amber)}
.bar10 .seg.line{box-shadow:inset 3px 0 0 var(--paper)}
.seg-pick{display:flex;flex-wrap:wrap;gap:4px}
.pick{font-family:var(--pixel);font-size:7px;letter-spacing:.5px;background:var(--night);color:var(--dim);border:2px solid var(--edge);padding:8px 6px;cursor:pointer;min-height:32px}
.pick.on{border-color:var(--amber);color:var(--amber)}
.odds.wide{min-width:560px}
.odds th.grp{text-align:center;color:var(--paper);border-bottom:1px solid var(--edge)}
.odds td.you{color:var(--amber);background:rgba(242,165,65,.12)}
.odds td.all{text-align:left;color:var(--dim)}
.odds sup{font-size:12px;color:var(--dim)}
.note{font-size:17px;color:var(--dim)}
.panel{background:var(--panel);border:3px solid var(--edge);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--pixel);font-size:10px;letter-spacing:.5px;margin:0;color:var(--amber);line-height:1.5}
.panel p{margin:0}
label.f{display:flex;flex-direction:column;gap:4px;font-family:var(--pixel);font-size:8px;color:var(--dim)}
select{font-family:var(--type);font-size:22px;background:var(--night);color:var(--paper);border:3px solid var(--paper);padding:6px 8px;border-radius:0}
.odds{width:100%;border-collapse:collapse;font-size:19px;font-variant-numeric:tabular-nums}
.odds th{font-family:var(--pixel);font-size:7px;color:var(--dim);font-weight:400;text-align:right;padding:4px 3px;vertical-align:bottom}
.odds th:first-child,.odds td:first-child{text-align:left}
.odds td{text-align:right;padding:3px 3px;border-top:1px solid var(--edge)}
.odds tr.you td{color:var(--amber)}
.scroll{overflow-x:auto}
.bar{height:10px;background:var(--edge);position:relative}
.bar span{position:absolute;inset:0 auto 0 0;background:var(--amber)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare>div{min-width:0;border:3px solid var(--edge);padding:8px;display:flex;flex-direction:column;gap:4px}
.compare h3{font-family:var(--pixel);font-size:8px;margin:0;color:var(--dim);line-height:1.5}
.sources{font-size:18px;color:var(--dim)} .sources a{color:var(--paper)}
.sources li{margin-bottom:4px}
footer{font-family:var(--pixel);font-size:7px;color:var(--dim);text-align:center;line-height:1.8}
footer a{color:var(--dim)}
.stage{font-family:var(--pixel);font-size:9px;letter-spacing:.5px;color:var(--amber);line-height:1.6}
.rollrow{display:flex;gap:14px;align-items:center}
.die{flex:none;width:64px;height:64px;display:grid;place-items:center;background:var(--night);border:4px solid var(--paper);box-shadow:inset 0 0 0 3px var(--panel);font-family:var(--pixel);font-size:22px;color:var(--paper)}
.die.win{border-color:var(--good);color:var(--good)} .die.lose{border-color:var(--bad);color:var(--bad)}
.delta{font-family:var(--pixel);font-size:13px;line-height:1.6} .delta.good{color:var(--good)} .delta.bad{color:var(--bad)}
.tk-odds{flex:1 1 100%;color:var(--paper)}
.spark .line.alt{stroke:var(--dim);stroke-dasharray:4 3} .spark .line.alt2{stroke:var(--good);stroke-dasharray:2 3}
.key{display:inline-block;width:14px;height:3px;vertical-align:middle;margin:0 4px 0 8px;background:var(--amber)} .key.k1{margin-left:0} .key.k2{background:var(--dim)} .key.k3{background:var(--good)}
.fifths{display:flex;flex-direction:column;gap:6px}
.fifth{display:grid;grid-template-columns:62px 1fr 34px 1fr 34px;gap:6px;align-items:center;font-size:18px}
.fifth .fl,.fifth .fh{font-family:var(--pixel);font-size:7px;color:var(--dim);letter-spacing:.5px}
.fifth.you .fl{color:var(--amber)}
.fb{height:10px;background:var(--night);border:1px solid var(--edge);position:relative;min-width:0}
.fb i{position:absolute;inset:0 auto 0 0} .fb i.g{background:var(--amber)} .fb i.r{background:var(--good)}
.fv{text-align:right;font-variant-numeric:tabular-nums}
.odds tr.you td{color:var(--amber)}
.src{font-size:17px;color:var(--dim)} .src a{color:var(--paper)}
@media (prefers-reduced-motion: reduce){.btn:hover .cur,.btn:focus-visible .cur{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LIFE LOTTERY</h1>
    <a href="../">EQUITABLE EARTH SOLUTIONS</a>
  </header>
  <div class="hud" id="hud" hidden>
    <span>AGE <b id="hAge">0</b></span>
    <span>INCOME <b id="hPct">-</b></span>
  </div>
  <div class="ticker" id="ticker" hidden aria-live="polite"></div>
  <div class="screen">
    <canvas id="cv" width="160" height="96" aria-label="Pixel scene of your character"></canvas>
    <div class="agetag" id="tag">USA</div>
  </div>
  <div class="dialog" id="dialog" aria-live="polite"></div>
  <div class="choices" id="choices"></div>
  <div id="extra"></div>
  <footer>ODDS FROM REAL US DATA &middot; <a href="#sources" id="srcLink">SOURCES</a><br>A TOOL BY <a href="https://equitableearth.solutions">EQUITABLE EARTH SOLUTIONS</a></footer>
</div>
<script src="data-us.js"></script>
<script src="dice.js"></script>
<script src="game.js"></script>
</body>
</html>
